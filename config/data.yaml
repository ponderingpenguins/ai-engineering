# Data paths, recording selection, denoising and window settings shared by all commands.
# Relative paths start at the repository root, but absolute paths are also accepted.
paths:
  raw_root: data/raw/floor_posture_dataset
  baked_dir: data/baked/floor_posture
  annotations_dir: data/annotations
# Recording selection always drops unknown participants to preserve person-wise splits, but is not included here.
selection:
  sensor_config: Config_4.cfg  # null allows all configs, but might cause issues since windows still require the expected shape.
  exclude_recordings:
  - '2311__20231124_152926'
  - '2311__20231124_153817'
# Optional heatmap denoising: subtract the range noise floor, then the temporal background.
denoising:
  range_normalise:
    enabled: false
    percentile: 10.0  # Estimate over the whole recording, including future frames.
    smooth_bins: 41  # Positive odd running-median width in range bins.
  temporal_background:
    enabled: false
    tau_frames: 300.0  # Previous-frame background, about 60 s at Config_4, but might hide still people so be careful.
# How selected frames become labelled windows. Unlabelled frames stay in the baked data.
windowing:
  target: lying_annotation  # Reviewed label track, use label_pose for the original pose track.
  collapse_lying: true  # Merge lying-prefixed labels into lying, all others become not_lying.
  window_len: 16  # Frames per window, about 3.2 s at Config_4.
  stride: 8  # Rows between starts, about 1.6 s, excluded from saved window signatures.
  label_rule: any_lying  # Use the last lying label if present, otherwise the final frame label.
  max_points: 128  # Keep the strongest points by SNR per PointNet window, then pad if needed.
