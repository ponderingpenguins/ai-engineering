# RNN-only settings. Shared optimiser and loop settings live in train.yaml.
arch:
  hidden: 128
  feat_dim: 64
  dropout: 0.5
  feature_dropout: 0.3
# Training-only heatmap augmentation; each setting below describes its units.
augment:
  noise: 0.05  # active Gaussian noise in standardised units
  range_shift_bins: 0.0  # optional; calibrated for Config_4
  floor_jitter: 0.0  # optional smooth baseline std in raw units
  time_reverse: false  # requires windowing.label_rule=any_lying
