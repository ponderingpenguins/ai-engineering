# CNN and GRU architecture and heatmap augmentation, shared fitting settings are in train.yaml.
arch:
  hidden: 128  # GRU hidden units.
  feat_dim: 64  # CNN output features per frame.
  dropout: 0.5  # Dropout before the classification layer.
  feature_dropout: 0.3  # Dropout on per-frame CNN features.
# Training batches only. Zero or false disables each transform.
augment:
  noise: 0.05  # Gaussian standard deviation relative to the training input scale.
  range_shift_bins: 0.0  # Maximum absolute range shift in Config_4 bins.
  floor_jitter: 0.0  # Smooth baseline standard deviation in raw heatmap units.
  time_reverse: false  # Reverse with probability 0.5, which requires label_rule=any_lying.
