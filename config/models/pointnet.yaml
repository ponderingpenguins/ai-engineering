# PointNet-only settings. Shared optimiser and loop settings live in train.yaml.
arch:
  width: 128
  dropout: 0.5
  point_dropout: 0.2  # feature dropout, distinct from dropping input points
# Training only. Geometric transforms are sized for Config_4.
augment:
  point_drop: 0.3  # active input-point drop probability
  jitter: 0.05  # active Gaussian std in standardised feature units
  shift_m: 0.0
  height_m: 0.0
  yaw_deg: 0.0  # requires windowing.collapse_lying=true
  tilt_deg: 0.0
  mirror: false  # requires windowing.collapse_lying=true
  ghost_points: 0.0  # mean synthetic points per window
  snr_jitter_db: 0.0  # one offset per window
