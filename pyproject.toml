[project]
name = "ai-engineering"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "eZbal", email = "efeozbal1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "vt-radar-recorder",
    "datasets>=5.0.1",
    "omegaconf>=2.3.1",
    "ultralytics>=8.4.165",
]

[project.optional-dependencies]
jupyter = [
    "jupyter",
    "ipykernel",
]

[project.scripts]
ai-engineering = "ai_engineering:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
vt-radar-recorder = { path = "data/raw/floor_posture_dataset/recorder", editable = true }

# setuptools' default editable-install mode (a MetaPathFinder import hook)
# isn't understood by static analyzers (Pylance/Pyright, PyCharm, mypy...),
# so vt_radar shows as unresolved even though it imports fine at runtime.
# "compat" mode falls back to a plain .pth path entry, which every tool
# resolves the same way `uv sync` does for the whole team.

[tool.uv]
config-settings-package = { vt-radar-recorder = { editable_mode = "compat" } }

[dependency-groups]
dev = [
    "mypy>=2.3.1",
]
