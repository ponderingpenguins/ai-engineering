[project]
name = "ai-engineering"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "eZbal", email = "efeozbal1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "omegaconf>=2.3.1",
]

[project.optional-dependencies]
jupyter = [
    "jupyter",
    "ipykernel",
]

[project.scripts]
ai-engineering = "ai_engineering:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
]
