[project]
name = "ai-engineering"
version = "0.1.0"
description = "Radar-based floor posture recognition with person-wise model evaluation."
readme = "README.md"
authors = [
    { name = "eZbal", email = "efeozbal1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
    "datasets>=5.0.1",
    "omegaconf>=2.3.1",
    "ultralytics>=8.4.165",
    "scikit-learn>=1.9.1",
    "loguru>=0.7.0",
    "numpy>=1.26,<2",  # pandas 2.2.x breaks on numpy 2.x when reading HDF5 recordings
    "pandas>=2.2,<3",
    "pyserial>=3.5",
    "tabulate>=0.9.0",
    "h5py>=3.10.0",
    "tables>=3.9.0",
    "opencv-python-headless>=4.5.0",
    "scipy>=1.7.0",
    "halo>=0.0.31",
]

[project.optional-dependencies]
jupyter = [
    "jupyter",
    "ipykernel",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.2.0",
]
